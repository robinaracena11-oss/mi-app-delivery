<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>La Esquinita | Gourmet App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-amber: #d97706;
            --brand-dark: #0f172a;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; -webkit-tap-highlight-color: transparent; user-select: none; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .app-container { padding-top: calc(1rem + var(--safe-top)); padding-bottom: calc(5rem + var(--safe-bottom)); }
        
        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(4.5rem + var(--safe-bottom));
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05); padding-bottom: var(--safe-bottom);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }

        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; transition: all 0.2s; background: none; border: none; }
        .tab-item.active { color: var(--brand-amber); }

        .sheet { position: fixed; inset: 0; z-index: 200; visibility: hidden; pointer-events: none; }
        .sheet-active { visibility: visible; pointer-events: auto; }
        .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.4s ease; }
        .sheet-content {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 2.5rem 2.5rem 0 0;
            height: 94%; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .sheet-active .sheet-overlay { opacity: 1; }
        .sheet-active .sheet-content { transform: translateY(0); }

        .btn-press:active { transform: scale(0.95); }
        .card-shadow { box-shadow: 0 4px 20px -5px rgba(15, 23, 42, 0.05); }

        .order-card { border-left: 4px solid #e2e8f0; transition: all 0.3s; }
        .order-card.Pendiente { border-left-color: #ef4444; }
        .order-card.Preparando { border-left-color: #f59e0b; }
        .order-card.Listo { border-left-color: #10b981; }

        .user-input { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 0.75rem 1rem; font-size: 13px; font-weight: 600; outline: none; transition: border 0.2s; }
        .user-input:focus { border-color: var(--brand-amber); }

        .pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #e2e8f0; transition: all 0.2s; }
        .pin-dot.filled { background: var(--brand-amber); border-color: var(--brand-amber); transform: scale(1.2); }
    </style>
</head>
<body class="antialiased">

    <!-- VISTA CLIENTE -->
    <div id="customer-view" class="app-container">
        <header class="px-5 mb-6 flex justify-between items-center">
            <div>
                <span class="text-[10px] font-bold text-amber-600 uppercase tracking-widest block mb-1">Cocinando Tradición</span>
                <h1 class="text-2xl font-black tracking-tighter">La Esquinita</h1>
            </div>
            <div class="w-9 h-9 rounded-full overflow-hidden border border-slate-100 shadow-sm">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Avatar">
            </div>
        </header>

        <section class="mb-6 space-y-8">
            <div id="section-bestsellers">
                <div class="px-5 mb-4"><h3 class="text-base font-black italic tracking-tight text-slate-800">Especialidades</h3></div>
                <div id="carousel-bestsellers" class="flex gap-3 overflow-x-auto px-5 no-scrollbar snap-x"></div>
            </div>
        </section>

        <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 mb-6">
            <div class="flex gap-2 px-5 py-3 overflow-x-auto no-scrollbar" id="category-pills"></div>
        </div>

        <main class="px-5">
            <div id="items-grid" class="grid grid-cols-2 gap-3 pb-20"></div>
        </main>
    </div>

    <!-- VISTA ADMINISTRADOR -->
    <div id="admin-view" class="app-container hidden bg-slate-50 min-h-screen">
        <header class="px-6 mb-8 pt-4 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-black italic tracking-tighter">Gestión Cocina</h2>
                <button onclick="cargarPedidosAdmin()" class="mt-2 bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-bold">↻ Actualizar Datos</button>
            </div>
            <button onclick="logoutAdmin()" class="text-red-500 text-[10px] font-black uppercase underline">Salir</button>
        </header>
        <div id="admin-orders-container" class="px-6 space-y-4 pb-20">
            <p class="text-center py-10 opacity-30 uppercase font-black tracking-widest text-[9px]">Cargando pedidos de Neon...</p>
        </div>
    </div>

    <!-- BARRA NAVEGACIÓN -->
    <nav class="tab-bar" id="main-tabs">
        <button onclick="switchView('customer')" class="tab-item active" id="tab-home">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[8px] font-bold uppercase">Inicio</span>
        </button>
        <button onclick="toggleCart()" class="tab-item relative" id="tab-cart">
            <div id="cart-icon-wrapper" class="flex flex-col items-center gap-1 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-600 text-white text-[7px] font-black h-3.5 w-3.5 flex items-center justify-center rounded-full shadow-sm">0</span>
                <span class="text-[8px] font-bold uppercase">Orden</span>
            </div>
        </button>
        <button onclick="tryAdminAccess()" class="tab-item" id="tab-admin">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            <span class="text-[8px] font-bold uppercase">Admin</span>
        </button>
    </nav>

    <!-- PANTALLA DE BLOQUEO PIN -->
    <div id="pin-screen" class="fixed inset-0 z-[300] bg-white hidden flex flex-col items-center justify-center p-8">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-amber-600 text-white rounded-full flex items-center justify-center font-black text-2xl mx-auto mb-4 italic">E</div>
            <h2 class="text-xl font-black italic">Acceso Administrador</h2>
            <p class="text-slate-400 text-xs mt-1 uppercase tracking-widest font-bold">Ingresa tu PIN secreto</p>
        </div>
        <div class="flex gap-4 mb-12">
            <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div>
        </div>
        <div class="grid grid-cols-3 gap-6 w-full max-w-xs" id="numpad"></div>
        <button onclick="closePinScreen()" class="mt-12 text-slate-400 text-[10px] font-black uppercase">Cancelar</button>
    </div>

    <!-- MODAL CARRITO -->
    <div id="cart-modal" class="sheet">
        <div class="sheet-overlay" onclick="toggleCart()"></div>
        <div class="sheet-content">
            <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mt-3 mb-2"></div>
            <header class="px-6 py-3 border-b flex justify-between items-center">
                <h2 class="text-xl font-black italic text-slate-800">Tu Orden</h2>
                <button onclick="clearCart()" class="text-[10px] font-bold text-slate-400 uppercase">Vaciar</button>
            </header>
            <div class="flex-grow overflow-y-auto px-6 py-4 space-y-6">
                <div id="cart-items" class="space-y-3"></div>
                <div class="bg-slate-50 p-5 rounded-[2rem] border border-slate-100 space-y-4">
                    <h4 class="text-[10px] font-black uppercase text-slate-400">Datos de Entrega</h4>
                    <input type="text" id="user-name" placeholder="Tu Nombre Completo" class="user-input" oninput="saveField('name', this.value)">
                    <input type="tel" id="user-phone" placeholder="WhatsApp" class="user-input" oninput="saveField('phone', this.value)">
                    <textarea id="user-address" placeholder="Dirección exacta" class="user-input h-20 resize-none" oninput="saveField('address', this.value)"></textarea>
                </div>
            </div>
            <div class="p-6 border-t bg-white rounded-t-[2rem] pb-safe shadow-xl">
                <div class="flex justify-between items-center mb-4"><span id="final-total" class="text-2xl font-black text-slate-900">$0</span></div>
                <button id="btn-submit-order" onclick="validateAndSubmit()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-[11px] shadow-lg btn-press">Realizar Pedido</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "1234";
        let isAdminAuthorized = false;
        let currentPin = "";
        let ordersList = [];

        const menuData = [
            { id: 1, cat: "Desayunos", n: "Los Tres Golpes", p: 175, img: "https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=400", best: true },
            { id: 11, cat: "Sandwiches", n: "Pierna Ahumada", p: 175, img: "https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=400", best: true },
            { id: 16, cat: "Sandwiches", n: "Philly Cheese Steak", p: 395, img: "https://images.unsplash.com/photo-1550507992-eb63ffee0847?w=400", best: true },
            { id: 25, cat: "Hamburguesas", n: "Classic Bacon", p: 250, img: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=400" },
            { id: 61, cat: "Pastas", n: "Blanca de Camarón", p: 550, img: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=400", best: true },
            { id: 82, cat: "Bebidas", n: "Café Dominicano", p: 75, img: "https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=400" }
        ];

        let cart = {}; 
        let currentCat = "Todos";
        const cats = ["Todos", "Desayunos", "Sandwiches", "Hamburguesas", "Pastas", "Bebidas"];

        // --- 1. ENVIAR PEDIDO A VERCEL/NEON ---
        async function validateAndSubmit() {
            const name = document.getElementById('user-name').value;
            if (!name) return alert("Por favor, ingresa tu nombre.");
            
            const arr = Object.values(cart);
            if (!arr.length) return alert("Tu carrito está vacío.");
            
            const btn = document.getElementById('btn-submit-order');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            try {
                const total = arr.reduce((acc, i) => acc + (i.p * i.qty), 0);
                
                // Asegurar formato correcto para la API
                const safeItems = arr.map(item => ({
                    name: item.n,
                    price: item.p,
                    qty: item.qty
                }));

                const orderData = { 
                    client: { 
                        name: name, 
                        phone: document.getElementById('user-phone').value || "No especificado", 
                        address: document.getElementById('user-address').value || "No especificada" 
                    }, 
                    items: safeItems, 
                    total: total
                };

                // Única llamada real a Vercel (Sin códigos basura)
                const respuesta = await fetch('/api/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                
                const resultado = await respuesta.json();
                
                if (!resultado.success) {
                    alert("Error en la Base de Datos: " + resultado.error);
                    btn.innerText = "Realizar Pedido";
                    btn.disabled = false;
                    return;
                }

                // Si se guardó en Neon, abrimos WhatsApp
                let msg = `*NUEVO PEDIDO*%0A👤: ${name.toUpperCase()}%0A💰 TOTAL: $${total}`;
                window.open(`https://wa.me/18297847674?text=${msg}`);
                
                cart = {}; 
                updateCartUI(); 
                toggleCart(); 
                alert("¡Pedido guardado exitosamente en Neon!");

            } catch(error) {
                alert("Error de conexión. Vercel no responde: " + error.message);
            } finally {
                btn.innerText = "Realizar Pedido";
                btn.disabled = false;
            }
        }

        // --- 2. LEER PEDIDOS EN EL PANEL ADMIN (DESDE NEON) ---
        async function cargarPedidosAdmin() {
            const container = document.getElementById('admin-orders-container');
            container.innerHTML = `<p class="text-center py-10 opacity-30 uppercase font-black text-[9px]">Cargando...</p>`;
            
            try {
                const res = await fetch('/api/leer');
                const data = await res.json();
                
                if(data.success) {
                    ordersList = data.pedidos;
                    renderAdminDashboard();
                } else {
                    container.innerHTML = `<p class="text-center text-red-500 text-xs mt-10">Error de Neon: ${data.error}</p>`;
                }
            } catch(e) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs mt-10">Error de conexión con Vercel</p>`;
            }
        }

        // --- 3. ACTUALIZAR ESTATUS EN EL PANEL ADMIN (HACIA NEON) ---
        async function cambiarEstatus(id, nuevoEstatus) {
            try {
                const res = await fetch('/api/actualizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: nuevoEstatus })
                });
                const data = await res.json();
                
                if(data.success) {
                    cargarPedidosAdmin(); // Recargar la lista
                } else {
                    alert("Error actualizando en Neon: " + data.error);
                }
            } catch(e) {
                alert("Error de conexión.");
            }
        }

        // --- NAVEGACIÓN Y VISTAS ---
        function switchView(view) {
            document.getElementById('customer-view').classList.toggle('hidden', view !== 'customer');
            document.getElementById('admin-view').classList.toggle('hidden', view !== 'admin');
            
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            if (view === 'customer') document.getElementById('tab-home').classList.add('active');
            if (view === 'admin') document.getElementById('tab-admin').classList.add('active');

            // Si entra al admin, descargar la data de Vercel/Neon
            if (view === 'admin') cargarPedidosAdmin();
        }

        function tryAdminAccess() {
            if (isAdminAuthorized) {
                switchView('admin');
            } else {
                currentPin = "";
                updatePinDots();
                document.getElementById('pin-screen').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdminAuthorized = false;
            switchView('customer');
        }

        // --- PIN PAD ---
        function renderPinPad() {
            const pad = document.getElementById('numpad');
            pad.innerHTML = "123456789 0⌫".split('').map(n => `
                <button onclick="${n === '⌫' ? 'clearPin()' : n === ' ' ? '' : `pressPin('${n}')`}" class="w-16 h-16 rounded-full bg-slate-50 text-xl font-bold btn-press ${n===' ' ? 'opacity-0' : ''}">${n}</button>
            `).join('');
        }
        function pressPin(n) {
            if(currentPin.length < 4) {
                currentPin += n;
                updatePinDots();
                if(currentPin.length === 4) {
                    if(currentPin === ADMIN_PIN) { 
                        isAdminAuthorized = true; 
                        document.getElementById('pin-screen').classList.add('hidden'); 
                        switchView('admin');
                    } else { 
                        currentPin = ""; 
                        setTimeout(() => updatePinDots(), 300); 
                    }
                }
            }
        }
        function clearPin() { currentPin = currentPin.slice(0, -1); updatePinDots(); }
        function updatePinDots() { for(let i=0; i<4; i++) { document.getElementById(`dot-${i}`).classList.toggle('filled', i < currentPin.length); } }
        function closePinScreen() { document.getElementById('pin-screen').classList.add('hidden'); currentPin = ""; updatePinDots(); }

        // --- ADMIN UI RENDER ---
        function renderAdminDashboard() {
            const container = document.getElementById('admin-orders-container');
            if(!ordersList.length) { 
                container.innerHTML = `<div class="text-center py-20 opacity-30 uppercase font-black tracking-widest text-[9px]">Sin pedidos en Neon</div>`; 
                return; 
            }
            container.innerHTML = ordersList.map(o => `
                <div class="order-card ${o.estatus || 'Pendiente'} bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-black text-sm italic uppercase mb-1">#${o.id} - ${o.client.name}</h4>
                            <p class="text-[9px] text-slate-400 font-bold">${o.client.phone}</p>
                            <p class="text-[8px] text-slate-400 italic">${o.client.address}</p>
                        </div>
                        <span class="text-[7px] font-black px-2 py-1 rounded-lg uppercase bg-slate-100">${o.estatus || 'Pendiente'}</span>
                    </div>
                    <div class="bg-slate-50/50 p-3 rounded-xl space-y-1">
                        ${o.items.map(i => `<p class="text-[10px] mono"><span class="font-bold text-amber-600">${i.qty}x</span> ${i.name}</p>`).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-2">
                        <p class="font-black text-xs text-slate-900">$${o.total}</p>
                        <div class="flex gap-2">
                            <button onclick="cambiarEstatus('${o.id}', 'Preparando')" class="p-2 bg-amber-50 text-amber-600 rounded-lg btn-press">🔥</button>
                            <button onclick="cambiarEstatus('${o.id}', 'Listo')" class="p-2 bg-green-50 text-green-600 rounded-lg btn-press">✅</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- RENDER MENU FRONTEND ---
        function renderUI() {
            document.getElementById('category-pills').innerHTML = cats.map(c => `<button onclick="filter('${c}')" class="cat-pill shrink-0 px-5 py-2.5 rounded-xl text-[9px] font-black uppercase border border-slate-100 bg-white ${currentCat === c ? 'active' : 'text-slate-400'}">${c}</button>`).join('');
            renderGrid(currentCat === "Todos" ? menuData : menuData.filter(i => i.cat === currentCat));
            renderCarousels();
            loadUserData();
            renderPinPad();
        }

        function renderGrid(items) {
            document.getElementById('items-grid').innerHTML = items.map(i => `
                <div class="bg-white rounded-2xl overflow-hidden card-shadow border border-slate-50 flex flex-col btn-press transition-all" onclick="addToCart(${i.id})">
                    <div class="h-32 relative"><img src="${i.img}" class="w-full h-full object-cover"></div>
                    <div class="p-3 flex-grow flex flex-col">
                        <h3 class="text-[10px] font-black italic uppercase line-clamp-1 leading-tight mb-1 text-slate-800">${i.n}</h3>
                        <span class="text-amber-600 font-black text-[9px] mt-auto">$${i.p}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderCarousels() {
            document.getElementById('carousel-bestsellers').innerHTML = menuData.filter(i => i.best).map(i => `
                <div onclick="addToCart(${i.id})" class="snap-start shrink-0 w-40 bg-white rounded-3xl card-shadow border border-slate-50 p-4">
                    <h4 class="font-black italic text-[10px] uppercase truncate text-slate-800">${i.n}</h4>
                    <p class="text-amber-600 font-black text-[8px] mt-1">$${i.p}</p>
                </div>
            `).join('');
        }

        function filter(c) { currentCat = c; renderUI(); }
        function addToCart(id) {
            if (cart[id]) cart[id].qty += 1; else cart[id] = { ...menuData.find(i => i.id === id), qty: 1 };
            updateCartUI();
            const wrapper = document.getElementById('cart-icon-wrapper');
            wrapper.classList.add('animate-cart-bounce'); setTimeout(()=>wrapper.classList.remove('animate-cart-bounce'), 500);
        }

        function updateCartUI() {
            const arr = Object.values(cart);
            document.getElementById('cart-count').innerText = arr.reduce((acc, i) => acc + i.qty, 0);
            document.getElementById('final-total').innerText = `$${arr.reduce((acc, i) => acc + (i.p * i.qty), 0)}`;
            const c = document.getElementById('cart-items');
            c.innerHTML = arr.length ? arr.map(i => `<div class="bg-slate-50 p-3 rounded-xl flex justify-between uppercase text-[9px] font-black text-slate-700"><span>${i.qty}x ${i.n}</span><span>$${i.p*i.qty}</span></div>`).join('') : `<p class="text-center py-10 opacity-20 text-[9px] font-black uppercase tracking-widest">Orden vacía</p>`;
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('sheet-active'); }
        function saveField(f, v) { localStorage.setItem(`user_${f}`, v); }
        function loadUserData() { ["name", "phone", "address"].forEach(f => { const el = document.getElementById(`user-${f}`); if(el) el.value = localStorage.getItem(`user_${f}`) || ""; }); }
        function clearCart() { if(confirm("¿Vaciar orden?")) { cart = {}; updateCartUI(); } }

        window.onload = renderUI;
    </script>
</body>
</html>
